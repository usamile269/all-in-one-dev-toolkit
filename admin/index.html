<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — All-in-One Dev Toolkit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0c0c0d;color:#f4f4f5;font-family:'DM Sans',system-ui,sans-serif;padding:20px}
  .card{width:100%;max-width:380px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:32px 28px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
  h1{font-family:'Playfair Display',serif;font-style:italic;font-weight:600;font-size:28px;margin:0 0 6px}
  p{color:#a1a1aa;font-size:14px;margin:0 0 22px}
  label{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#71717a;margin-bottom:8px}
  input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:#18181b;color:#f4f4f5;font-size:15px;outline:none}
  input:focus{border-color:rgba(255,255,255,.35)}
  button{width:100%;margin-top:14px;padding:13px;border:0;border-radius:12px;background:#fff;color:#0c0c0d;font-size:15px;font-weight:700;cursor:pointer}
  button:disabled{opacity:.6;cursor:wait}
  .msg{min-height:20px;font-size:13px;margin-top:14px;color:#f87171}
  a{color:#a1a1aa;font-size:13px;text-decoration:none}
</style>
</head>
<body>
  <div class="card">
    <h1>Admin Panel</h1>
    <p>Password do, panel khul jayega.</p>
    <form id="f">
      <label for="pw">Password</label>
      <input id="pw" type="password" autocomplete="current-password" placeholder="••••••••" required>
      <button id="btn" type="submit">Open Panel →</button>
      <div class="msg" id="msg"></div>
    </form>
    <a href="/">← Back to site</a>
  </div>
<script>
document.getElementById('f').addEventListener('submit', async function(e){
  e.preventDefault();
  var pw = document.getElementById('pw').value;
  var msg = document.getElementById('msg');
  var btn = document.getElementById('btn');
  btn.disabled = true; msg.style.color = '#a1a1aa'; msg.textContent = 'Checking…';
  try {
    var r = await fetch('/api/tools', {method:'POST', headers:{'Content-Type':'application/json','x-admin-key':pw}, body: JSON.stringify({verify:true})});
    if (r.ok) {
      sessionStorage.setItem('tk_admin_key', pw);
      location.replace('/?admin=1');
    } else if (r.status === 503) {
      msg.style.color = '#f87171'; msg.textContent = 'Admin password abhi set nahi hai. Owner ko bolo Vercel mein ADMIN_KEY lagaye.';
      btn.disabled = false;
    } else {
      msg.style.color = '#f87171'; msg.textContent = 'Wrong password. Dobara try karo.';
      btn.disabled = false;
    }
  } catch(err) {
    msg.style.color = '#f87171'; msg.textContent = 'Network error. Dobara try karo.';
    btn.disabled = false;
  }
});
</script>
</body>
</html>
